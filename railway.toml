# Service Railway worker — Root Directory du service = racine du monorepo (vide).
# Config path (si demandé) : railway.toml à la racine.

[build]
builder = "DOCKERFILE"
dockerfilePath = "services/worker/Dockerfile"
watchPatterns = [
  "services/worker/**",
  "packages/contracts/**",
  "packages/config/**",
  "templates/**",
  "features/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "package.json",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
