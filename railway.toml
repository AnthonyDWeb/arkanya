# Root Directory Railway = vide (racine monorepo), PAS /services/worker

[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @arkanya/worker build"
watchPatterns = [
  "services/worker/**",
  "packages/contracts/**",
  "packages/config/**",
  "templates/**",
  "features/**",
  "railpack.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "package.json",
]

[deploy]
startCommand = "node services/worker/dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
