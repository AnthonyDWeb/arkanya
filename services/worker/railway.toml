[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @arkanya/worker build"
watchPatterns = [
  "services/worker/**",
  "packages/contracts/**",
  "packages/config/**",
  "templates/**",
  "features/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "package.json",
]

[deploy]
startCommand = "pnpm --filter @arkanya/worker start"
restartPolicyType = "on_failure"
healthcheckPath = "/health"
healthcheckTimeout = 30
