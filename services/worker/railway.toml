# Si Config-as-code pointe ici : Root Directory doit quand même être la racine monorepo.
# Sinon les chemins start/build ci-dessous sont faux.

[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @arkanya/worker build"
watchPatterns = [
  "services/worker/**",
  "packages/contracts/**",
  "packages/config/**",
  "templates/**",
  "features/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "package.json",
]

[deploy]
startCommand = "node services/worker/dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
